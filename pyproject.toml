[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-recover"
version = "0.1.0"
description = "Terminal tool to recover deleted/formatted files from disks, USB drives, memory cards, and mounted phone storage."
requires-python = ">=3.8"
dependencies = []

[project.scripts]
data-recover = "data_recover.cli:main"
data-recover-gui = "data_recover.gui:main"

[tool.setuptools]
packages = ["data_recover", "data_recover.filesystems"]

[tool.setuptools.package-data]
data_recover = ["assets/*", "assets/*.ico"]
