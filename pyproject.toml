[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-recovery"
version = "0.1.0"
description = "Terminal tool to recover deleted/formatted files from disks, USB drives, memory cards, and mounted phone storage."
requires-python = ">=3.8"
dependencies = []

[project.scripts]
data-recovery = "data_recovery.cli:main"
data-recovery-gui = "data_recovery.gui:main"

[tool.setuptools]
packages = ["data_recovery", "data_recovery.filesystems"]

[tool.setuptools.package-data]
data_recovery = ["assets/*", "assets/*.ico"]
